# Scroller layout matching Niri's column workflow

gappih=1
gappiv=1
gappoh=1
gappov=1
borderpx=3
border_radius=0
focuscolor=0x7fc8ffff
bordercolor=0x505050ff
urgentcolor=0x9b0000ff
focused_opacity=1.0
unfocused_opacity=1.0
sloppyfocus=1
warpcursor=0

circle_layout=scroller,tile
ov_tab_mode=1
enable_hot_area=1
hot_area_size=3

animations=1
animation_duration_move=50
animation_duration_open=40
animation_duration_tag=35
animation_duration_close=80

scroller_default_proportion=0.5
scroller_default_proportion_single=0.5
scroller_focus_center=0
scroller_prefer_center=0
scroller_proportion_preset=0.3,0.45,0.65
tagrule=id:*,layout_name:scroller

# Keep Beeper on the second tag, matching Niri's named workspace.
windowrule=tags:2,isopensilent:1,appid:(?i)^(beepertexts|beeper|com\.automattic\.beeper)$

# Applications and utilities

bind=SUPER,comma,spawn,vicinae toggle
bind=CTRL+ALT,g,spawn,speakoflow --toggle-post-process
bind=SUPER,t,spawn,bash ~/.dotfiles/x/info.sh
bind=SUPER,p,spawn,bash ~/.dotfiles/x/util.sh
bind=SUPER,w,spawn_shell,pkill waybar || waybar

# Media keys

bindl=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1+
bindl=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_AUDIO_SINK@ 0.1-
bindl=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute,spawn,wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86MonBrightnessUp,spawn,brightnessctl --class=backlight set +10%
bindl=NONE,XF86MonBrightnessDown,spawn,brightnessctl --class=backlight set 10%-

# Focus and window movement

bind=ALT,Return,zoom,
bind=SUPER,BackSpace,togglejump
bind=ALT,Tab,switcher,all_next
bind=SUPER,o,toggleoverview
bind=SUPER,q,killclient
bind=SUPER,Left,focusdir,left
bind=SUPER,Down,focusdir,down
bind=SUPER,Up,focusdir,up
bind=SUPER,Right,focusdir,right
bind=SUPER,h,focusdir,left
bind=SUPER,j,focusdir,down
bind=SUPER,k,focusdir,up
bind=SUPER,l,focusdir,right
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Down,exchange_client,down
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,h,exchange_client,left
bind=SUPER+SHIFT,j,exchange_client,down
bind=SUPER+SHIFT,k,exchange_client,up
bind=SUPER+SHIFT,l,exchange_client,right

# Monitors

bind=SUPER+CTRL,Left,focusmon,left
bind=SUPER+CTRL,Down,focusmon,down
bind=SUPER+CTRL,Up,focusmon,up
bind=SUPER+CTRL,Right,focusmon,right
bind=SUPER+CTRL,h,focusmon,left
bind=SUPER+CTRL,j,focusmon,down
bind=SUPER+CTRL,k,focusmon,up
bind=SUPER+CTRL,l,focusmon,right
bind=SUPER+CTRL+SHIFT,Left,tagmon,left,1
bind=SUPER+CTRL+SHIFT,Down,tagmon,down,1
bind=SUPER+CTRL+SHIFT,Up,tagmon,up,1
bind=SUPER+CTRL+SHIFT,Right,tagmon,right,1
bind=SUPER+CTRL+SHIFT,h,tagmon,left,1
bind=SUPER+CTRL+SHIFT,j,tagmon,down,1
bind=SUPER+CTRL+SHIFT,k,tagmon,up,1
bind=SUPER+CTRL+SHIFT,l,tagmon,right,1

# Tags correspond to Niri workspaces.

bind=SUPER,Page_Down,viewtoright,0
bind=SUPER,Page_Up,viewtoleft,0
bind=SUPER,u,viewtoright,0
bind=SUPER,i,viewtoleft,0
bind=SUPER+CTRL,Page_Down,tagtoright,0
bind=SUPER+CTRL,Page_Up,tagtoleft,0
bind=SUPER+CTRL,u,tagtoright,0
bind=SUPER+CTRL,i,tagtoleft,0
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0
bind=SUPER+CTRL,1,tag,1,0
bind=SUPER+CTRL,2,tag,2,0
bind=SUPER+CTRL,3,tag,3,0
bind=SUPER+CTRL,4,tag,4,0
bind=SUPER+CTRL,5,tag,5,0
bind=SUPER+CTRL,6,tag,6,0
bind=SUPER+CTRL,7,tag,7,0
bind=SUPER+CTRL,8,tag,8,0
bind=SUPER+CTRL,9,tag,9,0
bind=SUPER,Tab,view,-1,0
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER+CTRL,DOWN,tagtoright
axisbind=SUPER+CTRL,UP,tagtoleft

# Scroller and window state

bind=SUPER,bracketleft,scroller_stack,left
bind=SUPER,bracketright,scroller_stack,right
bind=SUPER,r,switch_proportion_preset
bind=SUPER,f,togglemaximizescreen
bind=SUPER+SHIFT,f,togglefullscreen
bind=SUPER+CTRL,f,set_proportion,1.0
bind=SUPER,v,togglefloating

# Keyboard layout, screenshots, and session

bind=ALT,space,switch_keyboard_layout
bind=SUPER,space,switch_layout
bind=NONE,Print,spawn_shell,grim -g "$(slurp -w 0)" - | wl-copy
bind=CTRL,Print,spawn_shell,grim - | wl-copy
bind=SUPER+SHIFT,e,quit
bind=CTRL+ALT,Delete,quit
bind=SUPER+SHIFT,r,reload_config

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize
